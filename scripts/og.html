<!doctype html>
<!-- OGP画像（public/images/og.png）の元。npm run images で 1200x630 の PNG にする -->
<html lang="ja"><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#EFE9DC;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;color:#2E2B28;display:flex;align-items:center;position:relative}
.text{padding-left:90px;width:640px}
.brand{font-size:110px;font-weight:900;letter-spacing:4px;line-height:1}
.brand span{color:#C4643A}
.tag{font-size:30px;color:#6F6A62;letter-spacing:6px;margin-top:18px}
.catch{margin-top:56px;font-size:40px;font-weight:800;line-height:1.5}
.catch em{font-style:normal;color:#C4643A}
.shot{position:absolute;right:90px;top:70px;width:330px;border-radius:40px;overflow:hidden;box-shadow:0 20px 60px rgba(46,43,40,.18);border:8px solid #F9F5EC}
.shot img{display:block;width:100%}
.blob{position:absolute;right:-120px;bottom:-200px;width:620px;height:620px;border-radius:50%;background:#F3DFD2}
</style></head><body>
<div class="blob"></div>
<div class="text">
  <div class="brand">KIGEN<span>+</span></div>
  <div class="tag">賞味期限のその先へ</div>
  <div class="catch"><em>「期限から何日たった？」</em><br>を、すぐ確認。</div>
</div>
<div class="shot"><img src="../public/images/screen-detail.webp" alt=""></div>
</body></html>
